doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        auto_mapping: false
        mappings:
            Screening:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Screening/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Screening\Domain\Model'
            Reporting:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Reporting/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Reporting\Domain'

when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
