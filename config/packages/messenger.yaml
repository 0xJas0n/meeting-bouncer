framework:
    messenger:
        failure_transport: failed

        transports:
            # EvaluateInvite stays sync (single invite, MCP); bulk review queues QueueEvaluation here.
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'

        default_bus: command.bus

        buses:
            command.bus:
                middleware:
                    - doctrine_transaction
            query.bus: ~
            event.bus:
                default_middleware:
                    allow_no_handlers: true

        routing:
            App\Screening\Application\Command\QueueEvaluation: async

when@test:
    framework:
        messenger:
            transports:
                async: 'sync://'
